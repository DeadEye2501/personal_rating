[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Корень проекта в путь импорта: без него pytest кладёт туда папку самого теста,
# и "backend" не находится. Раньше это держали пустые "__init__.py", но с PEP 420
# пакету они не нужны — нужен только корень на пути.
#
# "scripts" рядом с ним — потому что инструмент карт импортирует соседей плоско
# (`import project_ast`), чтобы папку с ним можно было назвать в чужом проекте
# как угодно. Тест обязан импортировать его так же, как он импортирует себя сам.
pythonpath = . scripts
