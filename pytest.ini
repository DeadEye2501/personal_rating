[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Корень проекта в путь импорта: без него pytest кладёт туда папку самого теста,
# и "backend" не находится. Пустые "__init__.py" для этого не нужны — с PEP 420
# пакету хватает корня на пути.
pythonpath = .
