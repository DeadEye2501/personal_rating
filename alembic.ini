[alembic]
script_location = %(here)s/migrations

# Без этой строки env.py не найдёт пакет backend.
prepend_sys_path = .
path_separator = os

# Адрес базы приходит из настроек, а не отсюда: env.py собирает его сам.

# Настройки записи в лог читает fileConfig из env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
