# Черновики разведки под проверку не идут: `docs/` — одноразовая папка, её
# скрипты писались под один замер и живут ради его чисел, а не ради работы.
# Без этой строки `ruff check .` из чистого клона краснеет 35 замечаниями, все
# до единого в `docs/dedup-research/`, — то есть боевой код чист, а команда
# говорит обратное.
# `extend-exclude`, а не `exclude`: второй **заменяет** список умолчаний целиком,
# и вместе с `docs` из зоны вышли бы `.venv`, `node_modules`, `dist` и ещё
# полтора десятка папок — то есть настройка выключала бы куда больше, чем
# сказано. Замерено 23.08.2026.
extend-exclude = ["docs"]
